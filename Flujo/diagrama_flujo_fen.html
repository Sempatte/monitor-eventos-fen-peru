<style>
:root{--bg:#f1f1f1;--ink:#1a1a1a;--muted:#6b6b6b;--framebg:#fff;--frameline:#dcdcdc;--hdr:#fff}

html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--hdr);border-bottom:1px solid var(--frameline);padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;font-weight:500;margin:0 auto 0 0}
button{font:inherit;font-size:13px;padding:4px 12px;border:1px solid var(--frameline);background:transparent;color:var(--ink);border-radius:6px;cursor:pointer}
#wrap{overflow:auto;padding:16px 20px 40px}
svg text{font-family:inherit}
.shape{stroke:#1a1a1a;stroke-width:1.5}
.nt{font-size:14px;fill:#1a1a1a}
.cn{stroke:var(--ink);stroke-width:1.4}
.fr{fill:var(--framebg);stroke:var(--frameline);stroke-width:1}
.ft{font-size:16px;font-weight:500;fill:var(--muted)}
.grp{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 5}
.gt{font-size:13px;font-weight:500;fill:var(--muted)}
.gl-t{font-size:14px;font-weight:500;fill:var(--ink)}.gl-d{font-size:13px;fill:var(--muted)}
.lbg{fill:var(--framebg)}.lt{font-size:12px;fill:var(--ink)}
@media print{header{display:none}#wrap{padding:0}svg{width:100%!important;height:auto!important}}
